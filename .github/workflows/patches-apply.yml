name: patches apply to Strata v0.2.1
on: [push, pull_request]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/Niko1221/Strata.git strata && git -C strata checkout --quiet 90767252f420e25223c739d604145ad15911d48b
      - name: apply every patch in order, then check the manifest
        run: |
          cd strata
          for p in ../patches/[0-9][0-9]-*.patch; do patch -p1 --forward < "$p"; done
          sha256sum -c --quiet ../patches/MANIFEST.sha256

name: patches apply to Strata v0.1.41
on: [push, pull_request]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/Niko1221/Strata.git strata && git -C strata checkout --quiet fb58e0dbc8399662c0e47c76578c6e878b14f6cf
      - name: apply every patch in order, then check the manifest
        run: |
          cd strata
          for p in ../patches/[0-9][0-9]-*.patch; do patch -p1 --forward < "$p"; done
          sha256sum -c --quiet ../patches/MANIFEST.sha256

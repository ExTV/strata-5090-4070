name: patches apply to Strata v0.1.40.1
on: [push, pull_request]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/Niko1221/Strata.git strata && git -C strata checkout --quiet 82f46a8c8f475f001ad76d92f58f4a4f8ffb0253
      - name: apply every patch in order, then check the manifest
        run: |
          cd strata
          for p in ../patches/[0-9][0-9]-*.patch; do patch -p1 --forward < "$p"; done
          sha256sum -c --quiet ../patches/MANIFEST.sha256

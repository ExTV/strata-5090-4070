name: patches apply to the pinned Strata-DualGPU commit
on: [push, pull_request]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/Hardin22/Strata-DualGPU.git strata && git -C strata checkout --quiet dfdeb0540c5d7038531cde5fe2144ff7ad5cd9fe
      - name: apply every patch in order, then check the manifest
        run: |
          cd strata
          for p in ../patches/0*.patch; do patch -p1 --forward < "$p"; done
          sha256sum -c --quiet ../patches/MANIFEST.sha256

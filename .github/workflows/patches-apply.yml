name: patches apply to Strata v0.1.39
on: [push, pull_request]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/Niko1221/Strata.git strata && git -C strata checkout --quiet a1641e9f77aacad4d201b53c8a7ae8fa21059ebb
      - name: apply every patch in order, then check the manifest
        run: |
          cd strata
          for p in ../patches/[0-9][0-9]-*.patch; do patch -p1 --forward < "$p"; done
          sha256sum -c --quiet ../patches/MANIFEST.sha256

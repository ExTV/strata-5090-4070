name: patches apply to Strata v0.1.37
on: [push, pull_request]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --branch v0.1.37 --depth 1 https://github.com/Niko1221/Strata.git strata
      - name: apply every patch in order, then check the manifest
        run: |
          cd strata
          for p in ../patches/0*.patch; do patch -p1 --forward < "$p"; done
          sha256sum -c --quiet ../patches/MANIFEST.sha256
